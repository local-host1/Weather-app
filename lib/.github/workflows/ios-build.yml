name: Build iOS IPA

on:
  workflow_dispatch: # Allows you to manually click a button to start the build

jobs:
  build:
    runs-on: macos-latest # Instructs GitHub to launch a free Mac cloud server
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.22.0'

    - name: Create Dummy iOS Folder
      run: |
        flutter create . --platforms ios

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Unsigned IPA
      run: |
        flutter build ipa --no-codesign

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: My-iOS-Weather-App
        path: build/ios/ipa/*.ipa

