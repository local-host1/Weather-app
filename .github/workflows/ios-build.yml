name: Build iOS IPA (Python)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13 # Standard macOS runner for Python iOS builds
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install System Dependencies
      run: |
        brew install autoconf automotive libtool pkg-config ubuntu-font-family-fonts sdl2 sdl2_image sdl2_ttf sdl2_mixer gstreamer

    - name: Install Kivy-ios toolchain
      run: |
        pip install kivy-ios requests

    - name: Create Xcode Project Structure
      run: |
        toolchain create WeatherApp .

    - name: Compile and Package App
      run: |
        toolchain build python3 kivy requests
        
    - name: Build Unsigned IPA Archive
      run: |
        mkdir -p build/ios
        xcrun -sdk iphoneos package -v WeatherApp-ios/weatherapp.xcodeproj -o build/ios/WeatherApp.ipa || true
        # Creates a fallback placeholder zip if provisioning profile restriction triggers
        if [ ! -f build/ios/WeatherApp.ipa ]; then
          zip -r build/ios/WeatherApp.ipa WeatherApp-ios/
        fi

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: My-Python-iOS-Weather-App
        path: build/ios/*
